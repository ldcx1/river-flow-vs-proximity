[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "river-flow-vs-proximity"
version = "0.1.0"
description = "Reproduction code for the ICCP 2026 paper comparing river-flow graph topology with proximity in Sentinel-2 water-quality monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Doru Leșe" },
    { name = "Monica Vătafu" },
    { name = "Carla Bărăștean" },
    { name = "Ciprian Oprișa" },
]
keywords = ["remote-sensing", "sentinel-2", "river-graph", "water-quality", "earth-observation"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",   # sparse weight matrices for national-scale Moran's I (eval.graph_structure)
]

[project.optional-dependencies]
# XGBoost: detection, model comparison, Romania transfer, ensemble.
models = ["xgboost>=2.0"]
# pandas: proxy, events, resolution sweep, build_optical_series.
data = ["pandas>=2.0"]
# Graph neural network baseline (run_gnn.py: GAT vs no-edge MLP).
gnn = ["torch>=2.0", "torch-geometric>=2.4"]
# Google Earth Engine ingest (Sentinel-2 composites, CORINE ag fraction).
gee = ["earthengine-api>=0.1.380"]
# OpenStreetMap facility fetch (scripts/ingest/fetch_osm.py queries Overpass).
osm = ["requests>=2.28"]
# EU-Hydro geodatabase parsing (scripts/ingest/build_graph.py reads the GDB with geopandas).
geo = ["geopandas>=0.13"]
# Figures (results/make_figures.py).
figures = ["matplotlib>=3.7"]
# Tests. scikit-learn cross-checks the metrics and is the ensemble's calibrator.
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/ldcx1/river-flow-vs-proximity"
Repository = "https://github.com/ldcx1/river-flow-vs-proximity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
